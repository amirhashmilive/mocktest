name: Validate Data
on:
  push:
    paths:
      - 'data/*.json'
      - 'data/examination-configs/*.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Validate JSON
        run: node tools/validate-json.js

      - name: Validate Exam Dates
        run: node tools/validate-exam-dates.js
