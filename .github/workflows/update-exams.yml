name: Update Examination Dates
on:
  workflow_dispatch:  # Manual trigger only
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday

permissions:
  contents: write

jobs:
  update-exams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios cheerio

      - name: Update Examination Data
        run: node tools/update-exam-dates.js
        continue-on-error: true

      - name: Validate Dates
        run: node tools/validate-exam-dates.js
        continue-on-error: true

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exam-updates.json
          git commit -m "chore: update examination dates [skip ci]" || echo "No changes"
          git push || echo "Push failed (no changes)"
