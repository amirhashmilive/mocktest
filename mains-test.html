<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UPSC Civil Services Mains — Descriptive & Essay test interface on Mockhard.">
  <title>UPSC Mains Test — Mockhard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <style>
    /* ── Mains-specific Styles ── */
    .mains-header {
      background: linear-gradient(135deg, #0b2545, #13315c);
      color: #fff;
      padding: 18px 24px;
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
    }
    .mains-header .header-left h2 {
      font-size: 1.25rem;
      margin: 0 0 4px 0;
      font-family: var(--font-heading);
    }
    .mains-header .header-left p {
      font-size: 0.85rem;
      opacity: 0.8;
      margin: 0;
    }
    .mains-header .header-right {
      display: flex;
      align-items: center;
      gap: var(--space-md);
    }
    .mains-timer {
      font-size: 1.5rem;
      font-weight: 700;
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.12);
      padding: 8px 18px;
      border-radius: var(--radius-md);
      letter-spacing: 2px;
    }
    .mains-timer.warning { color: #f0a500; }
    .mains-timer.danger { animation: pulse 1s infinite; color: #e94560; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .question-nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: var(--space-lg);
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
    }
    .q-nav-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-primary);
    }
    .q-nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .q-nav-btn.answered {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .mains-question-card {
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      margin-bottom: var(--space-lg);
      transition: all 0.3s;
    }
    .mains-question-card.active-card {
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }
    .mq-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--space-md);
      flex-wrap: wrap;
      gap: var(--space-sm);
    }
    .mq-number {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary);
    }
    .mq-meta {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }
    .mq-meta .badge {
      font-size: 0.75rem;
    }
    .mq-text {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: var(--space-md);
      color: var(--text-primary);
    }
    .mq-guidelines {
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: var(--space-md);
      border-left: 3px solid var(--primary);
    }
    .mq-textarea {
      width: 100%;
      min-height: 220px;
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.7;
      resize: vertical;
      transition: border-color 0.3s;
    }
    .mq-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .mq-word-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 0.82rem;
    }
    .word-count { color: var(--text-secondary); }
    .word-count.over { color: var(--danger); font-weight: 600; }
    .word-count.good { color: var(--success); }

    .mains-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-md);
      margin-top: var(--space-xl);
      padding-top: var(--space-lg);
      border-top: 1px solid var(--border-color);
    }

    .progress-summary {
      display: flex;
      gap: var(--space-lg);
      font-size: 0.9rem;
    }
    .progress-summary span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Submit Overlay ── */
    .submit-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .submit-overlay.show { display: flex; }
    .submit-dialog {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .submit-dialog h3 { font-family: var(--font-heading); margin-bottom: var(--space-md); }
    .submit-dialog p { color: var(--text-secondary); margin-bottom: var(--space-lg); }
    .submit-dialog .btn-group { display: flex; gap: var(--space-md); justify-content: center; }

    @media (max-width: 768px) {
      .mains-header { padding: 14px 16px; }
      .mains-header .header-left h2 { font-size: 1rem; }
      .mains-timer { font-size: 1.15rem; padding: 6px 12px; }
      .mq-textarea { min-height: 160px; }
    }
  </style>
</head>
<body class="test-page">
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>

  <!-- ════════ MAIN CONTENT ════════ -->
  <main class="container" style="padding-top: 100px; padding-bottom: 60px;">
    <!-- Header -->
    <div class="mains-header" id="mainsHeader">
      <div class="header-left">
        <h2 id="paperTitle">🏛️📝 UPSC Mains — Loading...</h2>
        <p id="paperSubtitle">Preparing your test...</p>
      </div>
      <div class="header-right">
        <span class="badge badge-accent" id="levelBadge">Level C</span>
        <div class="mains-timer" id="mainsTimer">03:00:00</div>
      </div>
    </div>

    <!-- Question Navigation Bar -->
    <div class="question-nav-bar" id="questionNavBar">
      <!-- Dynamically rendered -->
    </div>

    <!-- Current Question -->
    <div id="questionContainer">
      <!-- Dynamically rendered -->
    </div>

    <!-- Footer Nav -->
    <div class="mains-footer">
      <div class="progress-summary" id="progressSummary">
        <span>✍️ Answered: <strong id="answeredCount">0</strong></span>
        <span>⏳ Remaining: <strong id="remainingCount">0</strong></span>
        <span>📝 Total: <strong id="totalCount">0</strong></span>
      </div>
      <div style="display: flex; gap: var(--space-sm);">
        <button class="btn btn-secondary btn-sm" id="prevBtn" disabled>← Prev</button>
        <button class="btn btn-primary btn-sm" id="nextBtn">Next →</button>
        <button class="btn btn-gold btn-sm" id="submitBtn">📤 Submit Paper</button>
      </div>
    </div>
  </main>

  <!-- Submit Confirmation -->
  <div class="submit-overlay" id="submitOverlay">
    <div class="submit-dialog">
      <h3>📋 Submit this paper?</h3>
      <p id="submitSummary">You have answered 0 out of 0 questions.</p>
      <div class="btn-group">
        <button class="btn btn-secondary" id="cancelSubmitBtn">Cancel</button>
        <button class="btn btn-gold" id="confirmSubmitBtn">✅ Confirm & Submit</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/questionLoader.js"></script>
  <script src="js/rotationEngine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mainsEngine.js"></script>
  <script>
    let currentQIndex = 0;
    let timerInterval = null;
    let timeRemaining = 0;
    let testSubmitted = false;

    const LEVEL_LABELS = {
      'C': 'Level C — Foundation',
      'B': 'Level B — Standard',
      'A': 'Level A — Advanced',
      'Aplus': 'Level A+ — Expert',
      'Aplusplus': 'Level A++ — Elite'
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const params = MockApp.getParams();
      const category = params.category || 'upsc-mains';
      const level = params.level || 'C';
      const paperIdx = params.paper || '0';
      const paperId = params.paperId || 'essay';
      const optional = params.optional || null;

      document.getElementById('levelBadge').innerText = LEVEL_LABELS[level] || `Level ${level}`;

      const { questions, paper } = await MainsEngine.init({
        category, level, paperIdx, paperId, optional
      });

      if (!questions || questions.length === 0) {
        document.getElementById('questionContainer').innerHTML = `
          <div class="empty-state" style="padding: 60px 0; text-align: center;">
            <div class="empty-icon">📭</div>
            <h3>No questions found</h3>
            <p>Could not load questions for this paper. Please go back and try again.</p>
            <a href="categories.html?category=upsc-mains" class="btn btn-primary" style="margin-top: var(--space-md);">← Back to Categories</a>
          </div>`;
        return;
      }

      // Set header
      let titleText = `🏛️📝 UPSC Mains — ${paper.name}`;
      if (optional) titleText += ` — ${optional}`;
      document.getElementById('paperTitle').innerText = titleText;

      let subtitleParts = [];
      if (paper.marks) subtitleParts.push(`${paper.marks} Marks`);
      if (paper.type) subtitleParts.push(paper.type);
      if (paper.qualifying) subtitleParts.push('(Qualifying)');
      document.getElementById('paperSubtitle').innerText = subtitleParts.join(' | ');

      // Timer
      timeRemaining = (paper.timeLimit || 180) * 60;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (testSubmitted) return;
        timeRemaining--;
        updateTimerDisplay();
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitPaper(true);
        }
      }, 1000);

      // Total count
      document.getElementById('totalCount').innerText = questions.length;
      document.getElementById('remainingCount').innerText = questions.length;

      // Render nav bar
      renderNavBar();
      renderQuestion(0);

      // Button handlers
      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentQIndex > 0) {
          saveCurrentAnswer();
          renderQuestion(currentQIndex - 1);
        }
      });
      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentQIndex < questions.length - 1) {
          saveCurrentAnswer();
          renderQuestion(currentQIndex + 1);
        }
      });
      document.getElementById('submitBtn').addEventListener('click', () => {
        saveCurrentAnswer();
        showSubmitOverlay();
      });
      document.getElementById('cancelSubmitBtn').addEventListener('click', () => {
        document.getElementById('submitOverlay').classList.remove('show');
      });
      document.getElementById('confirmSubmitBtn').addEventListener('click', () => {
        submitPaper(false);
      });
    });

    function updateTimerDisplay() {
      const h = Math.floor(timeRemaining / 3600);
      const m = Math.floor((timeRemaining % 3600) / 60);
      const s = timeRemaining % 60;
      const display = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      const timerEl = document.getElementById('mainsTimer');
      timerEl.innerText = display;

      timerEl.classList.remove('warning', 'danger');
      if (timeRemaining <= 300) timerEl.classList.add('danger');
      else if (timeRemaining <= 900) timerEl.classList.add('warning');
    }

    function renderNavBar() {
      const bar = document.getElementById('questionNavBar');
      bar.innerHTML = '';
      const questions = MainsEngine.getQuestions();
      questions.forEach((q, i) => {
        const btn = document.createElement('button');
        btn.className = 'q-nav-btn';
        btn.innerText = i + 1;
        if (i === currentQIndex) btn.classList.add('active');
        if ((MainsEngine.getAnswer(i) || '').trim().length > 0) btn.classList.add('answered');
        btn.addEventListener('click', () => {
          saveCurrentAnswer();
          renderQuestion(i);
        });
        bar.appendChild(btn);
      });
    }

    function renderQuestion(index) {
      currentQIndex = index;
      const questions = MainsEngine.getQuestions();
      const q = questions[index];
      if (!q) return;

      const container = document.getElementById('questionContainer');
      const savedAnswer = MainsEngine.getAnswer(index);
      const wordLimit = q.wordLimit || 250;
      const currentWords = MainsEngine.getWordCount(savedAnswer);

      let guidelinesHtml = '';
      if (q.explanation || q.guidelines) {
        guidelinesHtml = `<div class="mq-guidelines">
          <strong>Guidelines / Key Points:</strong><br>
          ${q.explanation || q.guidelines}
        </div>`;
      }
      if (q.section) {
        guidelinesHtml = `<div class="mq-guidelines" style="border-left-color: var(--gold);">
          <strong>${q.section}</strong><br>
          ${q.explanation || q.guidelines || ''}
        </div>` + guidelinesHtml.replace(q.explanation || q.guidelines || '', '');
      }

      container.innerHTML = `
        <div class="mains-question-card active-card">
          <div class="mq-header">
            <span class="mq-number">Question ${index + 1} of ${questions.length}</span>
            <div class="mq-meta">
              <span class="badge badge-primary">${q.marks || 15} Marks</span>
              <span class="badge badge-accent">${q.type || 'Descriptive'}</span>
              <span class="badge" style="background: var(--bg-secondary); color: var(--text-secondary);">~${wordLimit} words</span>
            </div>
          </div>
          <div class="mq-text">${q.question}</div>
          ${guidelinesHtml}
          <textarea class="mq-textarea" id="answerTextarea" placeholder="Write your answer here..." rows="12">${savedAnswer}</textarea>
          <div class="mq-word-bar">
            <span class="word-count" id="wordCountLabel">${currentWords} / ${wordLimit} words</span>
            <span style="color: var(--text-tertiary); font-size: 0.8rem;">${q.subject || ''}</span>
          </div>
        </div>
      `;

      // Attach input listener for live word count
      const textarea = document.getElementById('answerTextarea');
      textarea.addEventListener('input', () => {
        const wc = MainsEngine.getWordCount(textarea.value);
        const label = document.getElementById('wordCountLabel');
        label.innerText = `${wc} / ${wordLimit} words`;
        label.className = 'word-count';
        if (wc > wordLimit * 1.2) label.classList.add('over');
        else if (wc >= wordLimit * 0.8) label.classList.add('good');
      });

      // Focus textarea
      textarea.focus();

      // Update nav buttons
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === questions.length - 1;

      // Update nav bar highlight
      renderNavBar();
      updateProgressSummary();
    }

    function saveCurrentAnswer() {
      const textarea = document.getElementById('answerTextarea');
      if (textarea) {
        MainsEngine.saveAnswer(currentQIndex, textarea.value);
      }
    }

    function updateProgressSummary() {
      const questions = MainsEngine.getQuestions();
      let answered = 0;
      questions.forEach((q, i) => {
        if ((MainsEngine.getAnswer(i) || '').trim().length > 0) answered++;
      });
      document.getElementById('answeredCount').innerText = answered;
      document.getElementById('remainingCount').innerText = questions.length - answered;
    }

    function showSubmitOverlay() {
      const results = MainsEngine.calculateResults();
      document.getElementById('submitSummary').innerText =
        `You have answered ${results.attempted} out of ${results.total} questions. Total word count: ${results.totalWordCount} words.`;
      document.getElementById('submitOverlay').classList.add('show');
    }

    function submitPaper(autoSubmit) {
      testSubmitted = true;
      if (timerInterval) clearInterval(timerInterval);
      saveCurrentAnswer();

      const results = MainsEngine.calculateResults();
      const params = MockApp.getParams();

      const resultData = {
        category: params.category || 'upsc-mains',
        level: params.level || 'C',
        paperId: params.paperId || 'essay',
        paperName: results.paper ? results.paper.name : 'UPSC Mains',
        paperType: results.paper ? results.paper.type : 'Descriptive',
        total: results.total,
        attempted: results.attempted,
        unattempted: results.unattempted,
        totalWordCount: results.totalWordCount,
        avgWordCount: results.avgWordCount,
        timeUsed: (results.paper ? results.paper.timeLimit * 60 : 10800) - timeRemaining,
        autoSubmitted: autoSubmit,
        timestamp: new Date().toISOString(),
        questions: results.questions,
        answers: results.answers
      };

      // Save to localStorage
      MockStorage.saveResult(resultData);

      // Show results inline
      showMainsResults(resultData);
    }

    function showMainsResults(data) {
      document.getElementById('submitOverlay').classList.remove('show');
      document.getElementById('questionNavBar').style.display = 'none';

      const timeUsedMin = Math.floor(data.timeUsed / 60);
      const timeUsedSec = data.timeUsed % 60;

      let questionsHtml = '';
      data.questions.forEach((q, i) => {
        const answer = data.answers[i] || '';
        const wc = MainsEngine.getWordCount(answer);
        const statusIcon = answer.trim() ? '✅' : '⬜';

        questionsHtml += `
          <div class="mains-question-card" style="margin-bottom: var(--space-md);">
            <div class="mq-header">
              <span class="mq-number">${statusIcon} Question ${i + 1}</span>
              <div class="mq-meta">
                <span class="badge badge-primary">${q.marks || 15} Marks</span>
                <span class="badge" style="background: var(--bg-secondary);">${wc} words</span>
              </div>
            </div>
            <div class="mq-text" style="font-size: 0.92rem;">${q.question}</div>
            ${answer.trim() ? `<div style="background: var(--bg-secondary); padding: 14px; border-radius: var(--radius-sm); margin-top: var(--space-sm); font-size: 0.9rem; line-height: 1.6; white-space: pre-wrap;">${answer}</div>` : '<div style="color: var(--text-tertiary); font-style: italic; margin-top: var(--space-sm);">Not attempted</div>'}
            ${q.explanation ? `<div class="mq-guidelines" style="margin-top: var(--space-sm);"><strong>Model Answer / Key Points:</strong><br>${q.explanation}</div>` : ''}
          </div>
        `;
      });

      document.getElementById('questionContainer').innerHTML = `
        <div class="card" style="padding: var(--space-xl); margin-bottom: var(--space-xl);">
          <h2 style="text-align: center; margin-bottom: var(--space-lg); font-family: var(--font-heading);">
            📋 Paper Submitted ${data.autoSubmitted ? '(Auto — Time Up)' : ''}
          </h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-xl);">
            <div class="card" style="text-align: center; padding: var(--space-md);">
              <div style="font-size: 2rem; font-weight: 700; color: var(--primary);">${data.attempted}/${data.total}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary);">Questions Attempted</div>
            </div>
            <div class="card" style="text-align: center; padding: var(--space-md);">
              <div style="font-size: 2rem; font-weight: 700; color: var(--accent);">${data.totalWordCount}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary);">Total Words Written</div>
            </div>
            <div class="card" style="text-align: center; padding: var(--space-md);">
              <div style="font-size: 2rem; font-weight: 700; color: var(--gold);">${data.avgWordCount}</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary);">Avg Words/Answer</div>
            </div>
            <div class="card" style="text-align: center; padding: var(--space-md);">
              <div style="font-size: 2rem; font-weight: 700; color: var(--success);">${timeUsedMin}m ${timeUsedSec}s</div>
              <div style="font-size: 0.85rem; color: var(--text-secondary);">Time Used</div>
            </div>
          </div>

          <h3 style="margin-bottom: var(--space-md); font-family: var(--font-heading);">📝 Review Your Answers</h3>
          ${questionsHtml}

          <div style="text-align: center; margin-top: var(--space-xl);">
            <a href="categories.html?category=upsc-mains" class="btn btn-primary" style="margin-right: var(--space-sm);">📂 All UPSC Mains Papers</a>
            <a href="dashboard.html" class="btn btn-secondary">📊 Dashboard</a>
          </div>
        </div>
      `;

      // Hide footer
      document.querySelector('.mains-footer').style.display = 'none';
      document.getElementById('mainsTimer').innerText = '00:00:00';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
