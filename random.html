<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate a custom random mock test by selecting question count and exam categories on Mockhard.">
  <title>Random Test Generator — Mockhard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="random.html" class="nav-link active">Random Test</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ════════ MAIN CONTENT ════════ -->
  <main class="random-page">
    <div class="container">
      <div class="section-header text-center" style="margin-bottom: var(--space-2xl);">
        <h2>🎲 Random Test Generator</h2>
        <p>Mix questions from multiple exam categories to test your overall versatility.</p>
      </div>

      <div class="random-config card card-gradient">
        <!-- Question Count Selector -->
        <div class="config-group">
          <label class="config-label">1. Select Number of Questions:</label>
          <div class="config-options" id="countOptions">
            <div class="config-chip" data-count="10">10 Questions (12 mins)</div>
            <div class="config-chip active" data-count="25">25 Questions (30 mins)</div>
            <div class="config-chip" data-count="50">50 Questions (60 mins)</div>
          </div>
        </div>

        <!-- Categories Selector -->
        <div class="config-group">
          <div class="flex justify-between items-center" style="margin-bottom: var(--space-md);">
            <label class="config-label" style="margin-bottom: 0;">2. Select Included Categories:</label>
            <div class="flex gap-sm">
              <button id="selectAllBtn" class="btn btn-ghost btn-sm">Select All</button>
              <button id="deselectAllBtn" class="btn btn-ghost btn-sm">Deselect All</button>
            </div>
          </div>

          <div class="category-checkboxes" id="categoryCheckboxes">
            <!-- Checkboxes rendered by JS -->
          </div>
        </div>

        <!-- Launch CTA -->
        <div class="text-center" style="margin-top: var(--space-2xl);">
          <button id="startRandomTestBtn" class="btn btn-accent btn-lg" style="width: 100%; max-width: 400px;">
            🚀 Launch Random Test
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- ════════ FOOTER ════════ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-brand">
        <span>🎯</span>
        <span>Mockhard</span>
      </div>
      <div class="footer-text">Made with ❤️ for aspirants everywhere</div>
      <div class="footer-links">
        <a href="index.html" class="footer-link">Home</a>
        <a href="categories.html" class="footer-link">Categories</a>
        <a href="dashboard.html" class="footer-link">Dashboard</a>
      </div>
    </div>
  </footer>

  <!-- ════════ SCRIPTS ════════ -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    const CATEGORY_LIST = [
      { id: 'upsc', name: 'UPSC Civil Services' },
      { id: 'ssc', name: 'SSC CGL / CHSL' },
      { id: 'railways', name: 'Railways RRB' },
      { id: 'neet', name: 'NEET UG' },
      { id: 'norcet', name: 'AIIMS NORCET' },
      { id: 'jee', name: 'JEE Main' },
      { id: 'gate', name: 'GATE Exam' },
      { id: 'clat', name: 'CLAT Law' },
      { id: 'board', name: 'Board Examinations' },
      { id: 'defence', name: 'Defence (NDA/CDS)' },
    ];

    let selectedCount = 25;

    function renderCategoryCheckboxes() {
      const container = document.getElementById('categoryCheckboxes');
      container.innerHTML = '';

      CATEGORY_LIST.forEach(cat => {
        const label = document.createElement('label');
        label.className = 'category-checkbox checked';
        label.innerHTML = `
          <input type="checkbox" value="${cat.id}" checked>
          <span>${cat.name}</span>
        `;

        const chk = label.querySelector('input');
        chk.addEventListener('change', () => {
          label.classList.toggle('checked', chk.checked);
        });

        container.appendChild(label);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryCheckboxes();

      // Count chips click
      document.querySelectorAll('#countOptions .config-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('#countOptions .config-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          selectedCount = parseInt(chip.getAttribute('data-count'));
        });
      });

      // Select All / Deselect All
      document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('#categoryCheckboxes label').forEach(lbl => {
          lbl.classList.add('checked');
          lbl.querySelector('input').checked = true;
        });
      });

      document.getElementById('deselectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('#categoryCheckboxes label').forEach(lbl => {
          lbl.classList.remove('checked');
          lbl.querySelector('input').checked = false;
        });
      });

      // Start Random Test
      document.getElementById('startRandomTestBtn').addEventListener('click', () => {
        const checkedBoxes = Array.from(document.querySelectorAll('#categoryCheckboxes input:checked')).map(cb => cb.value);

        if (checkedBoxes.length === 0) {
          MockApp.showToast('Please select at least one category to launch test!', 'warning', 2500);
          return;
        }

        const catsQuery = checkedBoxes.join(',');
        window.location.href = `test.html?mode=random&count=${selectedCount}&cats=${catsQuery}`;
      });
    });
  </script>
</body>
</html>
