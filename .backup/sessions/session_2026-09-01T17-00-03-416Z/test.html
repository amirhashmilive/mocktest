<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Take mock test on Mockhard — Practice under real exam timer conditions with instant feedback.">
  <title>Mock Test — Mockhard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body class="test-page">
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="random.html" class="nav-link">Random Test</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ════════ TEST HEADER / BAR ════════ -->
  <header class="test-header">
    <div class="container">
      <div class="test-info">
        <span id="testCategoryName" class="test-category">Exam Category</span>
        <span id="questionCounter" class="test-question-num">Question 1 of 100</span>
      </div>

      <div class="flex items-center gap-md">
        <div id="testTimer" class="timer">
          <span class="timer-icon">⏱️</span>
          <span id="timerText">60:00</span>
        </div>
        <button id="shortcutsHelpBtn" class="btn btn-ghost btn-sm" style="font-weight: 600;">⌨️ Shortcuts (H)</button>
        <button id="submitTestBtn" class="btn btn-accent btn-sm">Submit Test (S)</button>
      </div>
    </div>
  </header>

  <!-- ════════ TEST BODY ════════ -->
  <main class="container">
    <div class="test-body">
      <!-- Question Section -->
      <section class="question-area">
        <div id="questionNumberHeader" class="question-number">Question 1</div>
        <div id="questionText" class="question-text">Loading question...</div>

        <!-- Options Container -->
        <div id="optionsList" class="options-list">
          <!-- Options rendered dynamically -->
        </div>

        <!-- Question Actions Footer -->
        <div class="question-actions">
          <div class="question-actions-left">
            <button id="bookmarkBtn" class="btn btn-ghost btn-sm bookmark-btn">
              🔖 <span id="bookmarkText">Bookmark (M)</span>
            </button>
            <button id="clearAnswerBtn" class="btn btn-ghost btn-sm">Clear Response</button>
          </div>
          <div class="question-actions-right">
            <button id="prevBtn" class="btn btn-outline btn-sm">◄ Previous (P)</button>
            <button id="nextBtn" class="btn btn-primary btn-sm">Next ► (N)</button>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="test-progress">
          <div class="flex justify-between items-center">
            <span class="progress-text">Progress (<span id="answeredCountText">0</span>/<span id="totalQuestionsCountText">100</span> Answered)</span>
            <span id="progressPercentageText" class="progress-text">0%</span>
          </div>
          <div class="progress-bar-container">
            <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Sidebar Question Palette -->
      <aside id="questionPalette" class="question-palette">
        <div class="palette-title">Question Palette (Q)</div>
        <div id="paletteGrid" class="palette-grid">
          <!-- Palette buttons 1..50 -->
        </div>

        <!-- Legend -->
        <div class="palette-legend">
          <div class="legend-item">
            <span class="legend-dot current"></span>
            <span>Current Question</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot answered"></span>
            <span>Answered</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot bookmarked"></span>
            <span>Bookmarked for Review</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot not-visited"></span>
            <span>Not Visited / Skipped</span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Mobile Palette Toggle -->
  <button id="paletteMobileToggle" class="palette-mobile-toggle" aria-label="Toggle question palette">
    📱
  </button>

  <!-- ════════ CORE APP & ENGINE SCRIPTS ════════ -->
  <script src="js/categories.js"></script>
  <script src="js/questionLoader.js"></script>
  <script src="js/rotationEngine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/revisionMode.js"></script>
  <script src="js/dailyPractice.js"></script>
  <script src="js/keyboardShortcuts.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>

  <!-- ════════ TEST CONTROLLER SCRIPT ════════ -->
  <script>
    const CATEGORY_NAMES = {
      upsc: 'UPSC Civil Services', ssc: 'SSC CGL / CHSL', railways: 'Railways RRB',
      neet: 'NEET UG', norcet: 'AIIMS NORCET', jee: 'JEE Main', gate: 'GATE Exam',
      clat: 'CLAT Law', board: 'Board Examinations', defence: 'Defence (NDA/CDS)'
    };

    const LEVEL_NAMES = { C: 'C (Beginner)', B: 'B (Intermediate)', A: 'A (Advanced)', Aplus: 'A+ (Expert)', Aplusplus: 'A++ (Elite)' };

    // State Variables
    let currentCategory = 'upsc';
    let currentLevel = 'C';
    let questions = [];
    let currentIndex = 0;
    let userAnswers = {}; // { questionIndex: optionIndex }
    let bookmarked = new Set();
    let totalQuestions = 120;
    let timeLimit = 120 * 60; // default 120 mins
    let defaultTimeLimit = 120 * 60;
    let isRandomMode = false;

    async function initTest() {
      const params = MockApp.getParams();

      if (params.mode === 'random') {
        isRandomMode = true;
        currentCategory = params.category || 'all';
        currentLevel = 'Auto';
        defaultTimeLimit = 20 * 60; // 20 minutes fixed for random test

        const saved = MockStorage.getInProgress();
        if (saved && saved.mode === 'random' && (params.resume === 'true' || confirm('Resume unfinished random test?'))) {
          questions = saved.questions || [];
          userAnswers = saved.answers || {};
          bookmarked = new Set(saved.bookmarked || []);
          currentIndex = saved.currentQuestion || 0;
          timeLimit = saved.timeRemaining || defaultTimeLimit;
          const subName = saved.categoryName || 'Random Practice';
          document.getElementById('testCategoryName').innerHTML = `🎲 ${subName} <span class="badge badge-accent" style="margin-left:8px;">Auto-Level Mix</span>`;
        } else {
          MockStorage.clearInProgress();
          await setupRandomTest(params);
          timeLimit = defaultTimeLimit;
        }
      } else {
        currentCategory = params.category || 'upsc';
        currentLevel = params.level || 'C';
        const paperIdx = parseInt(params.paper) || 0;

        // Fetch exam paper metadata
        const examConfig = await QuestionLoader.loadExamConfig(currentCategory);
        const papers = (examConfig && examConfig.papers) ? examConfig.papers : [];
        const paperConfig = papers[paperIdx] || papers[0] || null;

        const catName = CATEGORY_NAMES[currentCategory] || 'Competitive Exam';
        const levelLabel = currentLevel.replace('plus', '+');
        const paperSubName = paperConfig ? ` — ${paperConfig.name}` : '';

        document.getElementById('testCategoryName').innerHTML = `${catName}${paperSubName} <span class="badge badge-primary" style="margin-left:8px;">Level ${levelLabel}</span>`;

        // Fetch questions for category & level
        const pool = await QuestionLoader.load(currentCategory, currentLevel);
        const usedIds = RotationEngine.getUsedIds(currentCategory, currentLevel);
        
        const targetQCount = paperConfig ? paperConfig.questions : 100;
        const targetTimeMins = paperConfig ? paperConfig.timeLimit : 120;
        
        // Select targetQCount questions using rotation engine
        questions = RotationEngine.select(pool, targetQCount, usedIds);
        defaultTimeLimit = targetTimeMins * 60;

        // Check for saved in-progress standard test
        const saved = MockStorage.getInProgress();
        if (saved && saved.category === currentCategory && saved.level === currentLevel && saved.mode !== 'random') {
          if (confirm('You have an unfinished test in this level. Would you like to resume?')) {
            userAnswers = saved.answers || {};
            bookmarked = new Set(saved.bookmarked || []);
            currentIndex = saved.currentQuestion || 0;
            timeLimit = saved.timeRemaining || defaultTimeLimit;
          } else {
            MockStorage.clearInProgress();
            timeLimit = defaultTimeLimit;
          }
        } else {
          timeLimit = defaultTimeLimit;
        }
      }

      totalQuestions = questions.length;
      if (totalQuestions === 0) {
        alert('Question bank loading failed. Redirecting to categories page.');
        window.location.href = 'categories.html';
        return;
      }

      // Initialize Timer
      MockTimer.start(timeLimit, onTimerTick, onTimerExpire);

      // Render initial view
      renderPalette();
      renderQuestion(currentIndex);
      updateProgress();

      // Initialize Keyboard Shortcuts Engine
      KeyboardShortcuts.init({
        onSelectOption: (optIdx) => selectOption(currentIndex, optIdx),
        onNext: () => { if (currentIndex < totalQuestions - 1) renderQuestion(currentIndex + 1); },
        onPrev: () => { if (currentIndex > 0) renderQuestion(currentIndex - 1); },
        onMark: () => toggleBookmark(),
        onSubmit: () => {
          if (confirm('Are you sure you want to submit your test?')) submitTest();
        },
        onReset: () => {
          if (confirm('Reset test? All your current answers will be cleared.')) {
            userAnswers = {};
            renderQuestion(0);
            updateProgress();
          }
        },
        onToggleTimer: () => {
          const t = document.getElementById('testTimer');
          if (t) t.style.display = (t.style.display === 'none') ? 'flex' : 'none';
        },
        onTogglePalette: () => {
          const p = document.getElementById('questionPalette');
          if (p) p.classList.toggle('mobile-open');
        }
      });

      const shortcutsBtn = document.getElementById('shortcutsHelpBtn');
      if (shortcutsBtn) {
        shortcutsBtn.addEventListener('click', () => KeyboardShortcuts.toggleHelpOverlay());
      }
    }

    async function setupRandomTest(params) {
      const targetCat = params.category || 'all';
      const levels = ['C', 'B', 'A', 'Aplus', 'Aplusplus'];
      let pool = [];

      let catTitle = 'All Exams Mixed';
      if (targetCat !== 'all') {
        const categoriesList = (typeof CATEGORIES !== 'undefined') ? CATEGORIES : [];
        const found = categoriesList.find(c => c.id === targetCat);
        if (found) catTitle = found.name;
      }

      document.getElementById('testCategoryName').innerHTML = `🎲 ${catTitle} <span class="badge badge-accent" style="margin-left:8px;">Auto-Level Mix</span>`;

      // Fetch questions across all levels
      const catsToLoad = targetCat === 'all' 
        ? ['upsc', 'ssc', 'railways', 'neet', 'jee', 'gate', 'norcet', 'clat', 'board', 'defence', 'banking', 'police-state', 'foundation', 'teaching-net']
        : [targetCat];

      for (const lvl of levels) {
        for (const cat of catsToLoad) {
          const qList = await QuestionLoader.load(cat, lvl);
          pool.push(...qList);
        }
      }

      const usedIds = RotationEngine.getUsedIds('random', targetCat);
      questions = RotationEngine.select(pool, 15, usedIds);
    }

    function onTimerTick(data) {
      const timerEl = document.getElementById('testTimer');
      const timerText = document.getElementById('timerText');
      timerText.textContent = data.formatted;

      if (data.isDanger) {
        timerEl.className = 'timer danger';
      } else if (data.isWarning) {
        timerEl.className = 'timer warning';
      } else {
        timerEl.className = 'timer';
      }

      if (data.remaining % 10 === 0) {
        autoSaveState();
      }
    }

    function onTimerExpire() {
      MockApp.showToast('Time is up! Submitting your test automatically...', 'warning', 3000);
      setTimeout(() => {
        submitTest();
      }, 1500);
    }

    function autoSaveState() {
      MockStorage.saveInProgress({
        category: currentCategory,
        categoryName: isRandomMode ? 'Random Practice Test' : (CATEGORY_NAMES[currentCategory] || 'Standard Test'),
        level: currentLevel,
        answers: userAnswers,
        bookmarked: Array.from(bookmarked),
        timeRemaining: MockTimer.getRemaining(),
        currentQuestion: currentIndex,
        mode: isRandomMode ? 'random' : 'standard',
        questions: isRandomMode ? questions : null,
      });
    }

    function renderQuestion(index) {
      if (index < 0 || index >= totalQuestions) return;
      currentIndex = index;

      const q = questions[index];
      document.getElementById('questionNumberHeader').textContent = `Question ${index + 1} of ${totalQuestions}`;
      document.getElementById('questionCounter').textContent = `Question ${index + 1} of ${totalQuestions}`;
      document.getElementById('questionText').textContent = q.question;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, optIdx) => {
        const item = document.createElement('div');
        const isSelected = userAnswers[index] === optIdx;
        item.className = `option-item ${isSelected ? 'selected' : ''}`;
        item.innerHTML = `
          <div class="option-label">${labels[optIdx]}</div>
          <div class="option-text">${opt}</div>
        `;
        item.addEventListener('click', () => selectOption(index, optIdx));
        optionsList.appendChild(item);
      });

      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').textContent = (index === totalQuestions - 1) ? 'Finish & Review' : 'Next ►';

      const bookmarkBtn = document.getElementById('bookmarkBtn');
      const isBookmarked = bookmarked.has(index);
      bookmarkBtn.className = `btn btn-ghost btn-sm bookmark-btn ${isBookmarked ? 'active' : ''}`;
      document.getElementById('bookmarkText').textContent = isBookmarked ? 'Bookmarked' : 'Bookmark';

      updatePaletteHighlight();
    }

    function selectOption(qIdx, optIdx) {
      userAnswers[qIdx] = optIdx;
      renderQuestion(qIdx);
      updateProgress();
      updatePaletteItem(qIdx);
      autoSaveState();
    }

    function clearResponse() {
      delete userAnswers[currentIndex];
      renderQuestion(currentIndex);
      updateProgress();
      updatePaletteItem(currentIndex);
      autoSaveState();
      MockApp.showToast('Response cleared', 'info', 1500);
    }

    function toggleBookmark() {
      if (bookmarked.has(currentIndex)) {
        bookmarked.delete(currentIndex);
        MockApp.showToast('Bookmark removed', 'info', 1500);
      } else {
        bookmarked.add(currentIndex);
        MockApp.showToast('Question bookmarked for review', 'warning', 1500);
      }
      renderQuestion(currentIndex);
      updatePaletteItem(currentIndex);
      autoSaveState();
    }

    function updateProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      const pct = totalQuestions > 0 ? Math.round((answeredCount / totalQuestions) * 100) : 0;

      document.getElementById('answeredCountText').textContent = answeredCount;
      const totalEl = document.getElementById('totalQuestionsCountText');
      if (totalEl) totalEl.textContent = totalQuestions;
      document.getElementById('progressPercentageText').textContent = `${pct}%`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;
    }

    function renderPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';

      for (let i = 0; i < totalQuestions; i++) {
        const item = document.createElement('button');
        item.id = `paletteItem-${i}`;
        item.className = getPaletteClass(i);
        item.textContent = i + 1;
        item.addEventListener('click', () => {
          renderQuestion(i);
          closeMobilePalette();
        });
        grid.appendChild(item);
      }
    }

    function getPaletteClass(i) {
      let cls = 'palette-item';
      if (i === currentIndex) cls += ' current';
      else if (userAnswers[i] !== undefined) cls += ' answered';
      else if (bookmarked.has(i)) cls += ' bookmarked';
      else cls += ' not-visited';
      return cls;
    }

    function updatePaletteItem(i) {
      const item = document.getElementById(`paletteItem-${i}`);
      if (item) {
        item.className = getPaletteClass(i);
      }
    }

    function updatePaletteHighlight() {
      for (let i = 0; i < totalQuestions; i++) {
        updatePaletteItem(i);
      }
    }

    function closeMobilePalette() {
      const palette = document.getElementById('questionPalette');
      if (palette) palette.classList.remove('mobile-open');
    }

    function submitTest() {
      MockTimer.stop();
      MockStorage.clearInProgress();

      // Record used questions in rotation engine
      const usedQuestionIds = questions.map(q => q.id);
      RotationEngine.recordUsedIds(currentCategory, currentLevel, usedQuestionIds);

      // Calculate score
      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const timeTaken = MockTimer.getElapsed();

      // Save result
      const resultObj = {
        category: currentCategory,
        categoryName: CATEGORY_NAMES[currentCategory] || 'Random Test',
        level: currentLevel,
        score: correctCount,
        total: totalQuestions,
        timeTaken: timeTaken,
        answers: userAnswers,
        bookmarked: Array.from(bookmarked),
        mode: isRandomMode ? 'random' : 'standard',
      };

      const savedEntry = MockStorage.saveTestResult(resultObj);

      sessionStorage.setItem('mockhard_latest_result', JSON.stringify({
        ...resultObj,
        id: savedEntry.id,
        questions: questions,
      }));

      window.location.href = `results.html?id=${savedEntry.id}`;
    }

    function confirmSubmitModal() {
      const answeredCount = Object.keys(userAnswers).length;
      const unAnsweredCount = totalQuestions - answeredCount;
      const bookmarkCount = bookmarked.size;

      MockApp.showModal({
        title: 'Submit Test?',
        body: `
          <p>You are about to submit your <strong>120-question</strong> test.</p>
          <div style="margin-top: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: var(--radius-md); font-size: 0.9rem;">
            <div>✅ <strong>Answered:</strong> ${answeredCount} / ${totalQuestions}</div>
            <div>⚠️ <strong>Unanswered:</strong> ${unAnsweredCount}</div>
            <div>🔖 <strong>Bookmarked:</strong> ${bookmarkCount}</div>
          </div>
        `,
        confirmText: 'Yes, Submit Now',
        cancelText: 'Continue Test',
        confirmClass: 'btn-accent',
        onConfirm: submitTest,
      });
    }

    function handleKeyboard(e) {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key === 'ArrowRight' || e.key === 'n') {
        if (currentIndex < totalQuestions - 1) renderQuestion(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'p') {
        if (currentIndex > 0) renderQuestion(currentIndex - 1);
      } else if (['a', 'A', '1'].includes(e.key)) {
        selectOption(currentIndex, 0);
      } else if (['b', 'B', '2'].includes(e.key)) {
        selectOption(currentIndex, 1);
      } else if (['c', 'C', '3'].includes(e.key)) {
        selectOption(currentIndex, 2);
      } else if (['d', 'D', '4'].includes(e.key)) {
        selectOption(currentIndex, 3);
      }
    }

    // Bind event listeners
    document.addEventListener('DOMContentLoaded', () => {
      initTest();

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentIndex > 0) renderQuestion(currentIndex - 1);
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentIndex < totalQuestions - 1) {
          renderQuestion(currentIndex + 1);
        } else {
          confirmSubmitModal();
        }
      });

      document.getElementById('bookmarkBtn').addEventListener('click', toggleBookmark);
      document.getElementById('clearAnswerBtn').addEventListener('click', clearResponse);
      document.getElementById('submitTestBtn').addEventListener('click', confirmSubmitModal);

      // Mobile palette toggle button
      const paletteToggle = document.getElementById('paletteMobileToggle');
      const palette = document.getElementById('questionPalette');
      if (paletteToggle && palette) {
        paletteToggle.addEventListener('click', () => {
          palette.classList.toggle('mobile-open');
        });
      }
    });
  </script>
</body>
</html>
