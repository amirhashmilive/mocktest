<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Take mock test on Mockhard — Practice under real exam timer conditions with instant feedback.">
  <title>Mock Test — Mockhard</title>
  <!-- Prevent dark mode flash: apply saved theme BEFORE CSS loads -->
  <script>
    (function() {
      try {
        var theme = JSON.parse(localStorage.getItem('mockhard_theme'));
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body class="test-page">
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="random.html" class="nav-link">Random Test</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ════════ TEST HEADER / BAR ════════ -->
  <header class="test-header">
    <div class="container">
      <div class="test-info">
        <span id="testCategoryName" class="test-category">Exam Category</span>
        <span id="questionCounter" class="test-question-num">Question 1 of 50</span>
      </div>

      <div class="flex items-center gap-md">
        <div id="testTimer" class="timer">
          <span class="timer-icon">⏱️</span>
          <span id="timerText">60:00</span>
        </div>
        <button id="shortcutsHelpBtn" class="btn btn-ghost btn-sm" style="font-weight: 600;">⌨️ Shortcuts (H)</button>
        <button id="submitTestBtn" class="btn btn-accent btn-sm">Submit Test (S)</button>
      </div>
    </div>
  </header>

  <!-- ════════ TEST BODY ════════ -->
  <main class="container">
    <div class="test-body">
      <!-- Question Section -->
      <section class="question-area">
        <div id="questionNumberHeader" class="question-number">Question 1</div>
        <div id="questionText" class="question-text">Loading question...</div>

        <!-- Options Container -->
        <div id="optionsList" class="options-list">
          <!-- Options rendered dynamically -->
        </div>

        <!-- Question Actions Footer -->
        <div class="question-actions">
          <div class="question-actions-left">
            <button id="bookmarkBtn" class="btn btn-ghost btn-sm bookmark-btn">
              🔖 <span id="bookmarkText">Bookmark (M)</span>
            </button>
            <button id="clearAnswerBtn" class="btn btn-ghost btn-sm">Clear Response</button>
          </div>
          <div class="question-actions-right">
            <button id="prevBtn" class="btn btn-outline btn-sm">◄ Previous (P)</button>
            <button id="nextBtn" class="btn btn-primary btn-sm">Next ► (N)</button>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="test-progress">
          <div class="flex justify-between items-center">
            <span class="progress-text">Progress (<span id="answeredCountText">0</span>/<span id="totalQuestionsCountText">50</span> Answered)</span>
            <span id="progressPercentageText" class="progress-text">0%</span>
          </div>
          <div class="progress-bar-container">
            <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Sidebar Question Palette -->
      <aside id="questionPalette" class="question-palette">
        <div class="palette-title">Question Palette (Q)</div>
        <div id="paletteGrid" class="palette-grid">
          <!-- Palette buttons 1..50 -->
        </div>

        <!-- Legend -->
        <div class="palette-legend">
          <div class="legend-item">
            <span class="legend-dot current"></span>
            <span>Current Question</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot answered"></span>
            <span>Answered</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot bookmarked"></span>
            <span>Bookmarked for Review</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot not-visited"></span>
            <span>Not Visited / Skipped</span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Mobile Palette Toggle -->
  <button id="paletteMobileToggle" class="palette-mobile-toggle" aria-label="Toggle question palette">
    📱
  </button>

  <!-- ════════ CORE APP & ENGINE SCRIPTS ════════ -->
  <script src="js/categories.js"></script>
  <script src="js/questionLoader.js"></script>
  <script src="js/rotationEngine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ugc-net.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/revisionMode.js"></script>
  <script src="js/dailyPractice.js"></script>
  <script src="js/keyboardShortcuts.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/stage0-dataGate.js"></script>
  <script src="js/stage1-extractor.js"></script>
  <script src="js/stage2-classifier.js"></script>
  <script src="js/stage3-patterns.js"></script>
  <script src="js/stage4-prioritise.js"></script>
  <script src="js/stage5-knowledgeGraph.js"></script>
  <script src="js/stage6-blueprint.js"></script>
  <script src="js/stage7-generation.js"></script>
  <script src="js/stage8-verification.js"></script>
  <script src="js/stage9-adversarial.js"></script>
  <script src="js/stage10-originality.js"></script>
  <script src="js/stage11-quality.js"></script>
  <script src="js/stage12-finalise.js"></script>
  <script src="js/stage13-audit.js"></script>
  <script src="js/evidenceEngine.js"></script>
  <script src="js/app.js"></script>

  <!-- ════════ RANDOMIZED PAPER ENGINE & SAFETY PROTOCOLS ════════ -->
  <script src="js/paperEngine.js"></script>
  <script src="js/testEngine.js"></script>
  <script src="js/safetyProtocols.js"></script>
  <script src="js/resultAnalyzer.js"></script>

  <!-- ════════ TEST CONTROLLER SCRIPT ════════ -->
  <script>
    const CATEGORY_NAMES = {
      upsc: 'UPSC Civil Services', ssc: 'SSC CGL / CHSL', railways: 'Railways RRB',
      neet: 'NEET UG', norcet: 'AIIMS NORCET', jee: 'JEE Main', gate: 'GATE Exam',
      clat: 'CLAT Law', board: 'Board Examinations', defence: 'Defence (NDA/CDS)',
      banking: 'Banking Exams', 'police-state': 'State Police', foundation: 'Foundation & Core Subjects',
      teaching: 'Teaching Exams (TET/CTET)', 'ugc-net': 'UGC NET / JRF'
    };

    let activeTestEngine = null;

    async function initTest() {
      const params = MockApp.getParams();
      console.log('🔍 initTest params:', JSON.stringify(params));

      // Clear expired test states older than 24 hours
      if (typeof SafetyProtocols !== 'undefined') {
        SafetyProtocols.clearExpiredStates();
      }

      const category = params.category || 'upsc';
      const level = params.level || 'C';
      const subject = params.subject ? decodeURIComponent(params.subject) : null;
      const count = parseInt(params.count) || 50;
      const timeLimitMins = parseInt(params.time) || 100;

      // Check for refresh or crash recovery
      let existingState = null;
      if (typeof SafetyProtocols !== 'undefined') {
        existingState = SafetyProtocols.handleRefresh() || SafetyProtocols.handleCrashRecovery();
      }

      let paperIdToLoad = null;
      if (existingState && existingState.paperId) {
        if (params.resume === 'true' || confirm('An unfinished test was detected. Would you like to resume where you left off?')) {
          paperIdToLoad = existingState.paperId;
        } else {
          if (typeof TestEngine !== 'undefined') {
            const oldEngine = new TestEngine({ paperId: existingState.paperId });
            oldEngine.clearState();
          }
        }
      }

      // Initialize Test Engine
      activeTestEngine = new TestEngine({
        paperId: paperIdToLoad,
        category: category,
        level: level,
        subject: subject,
        totalQuestions: count,
        timeLimit: timeLimitMins
      });

      await activeTestEngine.initialize();

      // Start Auto-Save Protocol
      if (typeof SafetyProtocols !== 'undefined') {
        SafetyProtocols.startAutoSave(activeTestEngine);
      }

      // Set Header Title
      const catName = CATEGORY_NAMES[activeTestEngine.category] || activeTestEngine.category.toUpperCase();
      const levelLabel = activeTestEngine.level.replace('plusplus', '++').replace('plus', '+');
      const paperBadge = `<span class="badge badge-accent" style="margin-left:8px;">ID: ${activeTestEngine.paperId}</span>`;

      document.getElementById('testCategoryName').innerHTML = `${catName} — Level ${levelLabel} ${paperBadge}`;

      // Start Timer
      const remainingSeconds = (activeTestEngine.timeLimit * 60) - (activeTestEngine.timeSpent || 0);
      MockTimer.start(remainingSeconds > 0 ? remainingSeconds : activeTestEngine.timeLimit * 60, onTimerTick, onTimerExpire);

      // Render initial UI
      renderPalette();
      renderCurrentQuestion();
      updateProgressUI();

      // Bind Keyboard Shortcuts
      if (typeof KeyboardShortcuts !== 'undefined') {
        KeyboardShortcuts.init({
          onSelectOption: (optIdx) => selectOption(optIdx),
          onNext: () => { if (activeTestEngine.goToNext()) renderCurrentQuestion(); },
          onPrev: () => { if (activeTestEngine.goToPrevious()) renderCurrentQuestion(); },
          onMark: () => toggleBookmark(),
          onSubmit: () => confirmSubmitModal(),
          onReset: () => {
            if (confirm('Reset test? All your current answers will be cleared.')) {
              activeTestEngine.answers = {};
              activeTestEngine.saveState();
              renderCurrentQuestion();
              updateProgressUI();
            }
          },
          onToggleTimer: () => {
            const t = document.getElementById('testTimer');
            if (t) t.style.display = (t.style.display === 'none') ? 'flex' : 'none';
          },
          onTogglePalette: () => {
            const p = document.getElementById('questionPalette');
            if (p) p.classList.toggle('mobile-open');
          }
        });
      }

      const shortcutsBtn = document.getElementById('shortcutsHelpBtn');
      if (shortcutsBtn) {
        shortcutsBtn.addEventListener('click', () => KeyboardShortcuts.toggleHelpOverlay());
      }
    }

    function onTimerTick(data) {
      if (activeTestEngine) {
        activeTestEngine.timeSpent = MockTimer.getElapsed();
      }

      const timerEl = document.getElementById('testTimer');
      const timerText = document.getElementById('timerText');
      if (timerText) timerText.textContent = data.formatted;

      if (timerEl) {
        if (data.isDanger) timerEl.className = 'timer danger';
        else if (data.isWarning) timerEl.className = 'timer warning';
        else timerEl.className = 'timer';
      }

      if (data.remaining % 15 === 0 && activeTestEngine) {
        activeTestEngine.saveState();
      }
    }

    function onTimerExpire() {
      MockApp.showToast('Time is up! Submitting your test automatically...', 'warning', 3000);
      setTimeout(() => {
        submitTest();
      }, 1500);
    }

    function renderCurrentQuestion() {
      if (!activeTestEngine) return;
      const q = activeTestEngine.getCurrentQuestion();
      const index = activeTestEngine.currentQuestionIndex;
      const total = activeTestEngine.getQuestionCount();

      if (!q) return;

      document.getElementById('questionNumberHeader').textContent = `Question ${index + 1} of ${total}`;
      document.getElementById('questionCounter').textContent = `Question ${index + 1} of ${total}`;

      const rawText = (q.question || q.questionText || '')
        .replace(/^\[.*?\]\s*/, '')
        .replace(/^Question \d+ — .*? examination\.?\s*/gi, '')
        .replace(/\s*\[Variant #\d+\]/gi, '');

      document.getElementById('questionText').textContent = rawText;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      const optsArray = Array.isArray(q.options)
        ? q.options
        : [q.options.a, q.options.b, q.options.c, q.options.d];

      optsArray.forEach((optText, optIdx) => {
        const item = document.createElement('div');
        const isSelected = activeTestEngine.answers[index] === optIdx;
        item.className = `option-item ${isSelected ? 'selected' : ''}`;
        item.innerHTML = `
          <div class="option-label">${labels[optIdx]}</div>
          <div class="option-text">${escapeHtml(optText)}</div>
        `;
        item.addEventListener('click', () => selectOption(optIdx));
        optionsList.appendChild(item);
      });

      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').textContent = (index === total - 1) ? 'Finish & Review' : 'Next ►';

      const bookmarkBtn = document.getElementById('bookmarkBtn');
      const isBookmarked = !!activeTestEngine.markedForReview[index];
      bookmarkBtn.className = `btn btn-ghost btn-sm bookmark-btn ${isBookmarked ? 'active' : ''}`;
      document.getElementById('bookmarkText').textContent = isBookmarked ? 'Bookmarked' : 'Bookmark';

      updateProgressUI();
      updatePaletteHighlight();
    }

    function selectOption(optIdx) {
      if (!activeTestEngine) return;
      activeTestEngine.answerQuestion(activeTestEngine.currentQuestionIndex, optIdx);
      renderCurrentQuestion();
    }

    function clearResponse() {
      if (!activeTestEngine) return;
      activeTestEngine.answerQuestion(activeTestEngine.currentQuestionIndex, null);
      renderCurrentQuestion();
      MockApp.showToast('Response cleared', 'info', 1500);
    }

    function toggleBookmark() {
      if (!activeTestEngine) return;
      const isMarked = activeTestEngine.markForReview(activeTestEngine.currentQuestionIndex);
      renderCurrentQuestion();
      MockApp.showToast(isMarked ? 'Question bookmarked for review' : 'Bookmark removed', 'warning', 1500);
    }

    function updateProgressUI() {
      if (!activeTestEngine) return;
      const progress = activeTestEngine.getProgress();

      document.getElementById('answeredCountText').textContent = progress.answered;
      const totalEl = document.getElementById('totalQuestionsCountText');
      if (totalEl) totalEl.textContent = progress.total;
      document.getElementById('progressPercentageText').textContent = `${progress.percentage}%`;
      document.getElementById('progressBarFill').style.width = `${progress.percentage}%`;
    }

    function renderPalette() {
      if (!activeTestEngine) return;
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';
      const total = activeTestEngine.getQuestionCount();

      for (let i = 0; i < total; i++) {
        const item = document.createElement('button');
        item.id = `paletteItem-${i}`;
        item.className = getPaletteClass(i);
        item.textContent = i + 1;
        item.addEventListener('click', () => {
          activeTestEngine.jumpToQuestion(i);
          renderCurrentQuestion();
          closeMobilePalette();
        });
        grid.appendChild(item);
      }
    }

    function getPaletteClass(i) {
      if (!activeTestEngine) return 'palette-item';
      let cls = 'palette-item';
      if (i === activeTestEngine.currentQuestionIndex) cls += ' current';
      else if (activeTestEngine.answers[i] !== undefined && activeTestEngine.answers[i] !== null) cls += ' answered';
      else if (activeTestEngine.markedForReview[i]) cls += ' bookmarked';
      else cls += ' not-visited';
      return cls;
    }

    function updatePaletteItem(i) {
      const item = document.getElementById(`paletteItem-${i}`);
      if (item) {
        item.className = getPaletteClass(i);
      }
    }

    function updatePaletteHighlight() {
      if (!activeTestEngine) return;
      const total = activeTestEngine.getQuestionCount();
      for (let i = 0; i < total; i++) {
        updatePaletteItem(i);
      }
    }

    function closeMobilePalette() {
      const palette = document.getElementById('questionPalette');
      if (palette) palette.classList.remove('mobile-open');
    }

    function submitTest() {
      if (!activeTestEngine) return;
      MockTimer.stop();

      if (typeof SafetyProtocols !== 'undefined') {
        SafetyProtocols.stopAutoSave();
      }

      // Record used question IDs in Rotation Engine
      const questions = activeTestEngine.paper ? activeTestEngine.paper.questions : [];
      if (typeof RotationEngine !== 'undefined' && questions.length > 0) {
        const usedIds = questions.map(q => q.id);
        RotationEngine.recordUsedIds(activeTestEngine.category, activeTestEngine.level, usedIds);
      }

      // Compute results
      const results = (typeof analyzeResults !== 'undefined')
        ? analyzeResults(activeTestEngine.paper, activeTestEngine.answers, MockTimer.getElapsed())
        : activeTestEngine.getResults();

      const catNameLabel = CATEGORY_NAMES[activeTestEngine.category] || activeTestEngine.category.toUpperCase();

      const resultObj = {
        paperId: activeTestEngine.paperId,
        category: activeTestEngine.category,
        categoryName: catNameLabel,
        subjectName: activeTestEngine.subject,
        level: activeTestEngine.level,
        score: results.score,
        total: results.total,
        timeTaken: MockTimer.getElapsed(),
        answers: activeTestEngine.answers,
        bookmarked: Object.keys(activeTestEngine.markedForReview).filter(k => activeTestEngine.markedForReview[k]).map(Number),
        date: new Date().toISOString()
      };

      const savedEntry = MockStorage.saveTestResult(resultObj);

      // Save complete snapshot with randomized questions & shuffled options for results.html
      sessionStorage.setItem('mockhard_latest_result', JSON.stringify({
        ...resultObj,
        id: savedEntry.id,
        questions: questions,
        paper: activeTestEngine.paper
      }));

      // Clear in-progress test state
      activeTestEngine.clearState();

      window.location.href = `results.html?id=${savedEntry.id}`;
    }

    function confirmSubmitModal() {
      if (!activeTestEngine) return;
      const progress = activeTestEngine.getProgress();

      MockApp.showModal({
        title: 'Submit Test?',
        body: `
          <p>You are about to submit your <strong>${progress.total}-question</strong> randomized test paper.</p>
          <div style="margin-top: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: var(--radius-md); font-size: 0.9rem;">
            <div>✅ <strong>Answered:</strong> ${progress.answered} / ${progress.total}</div>
            <div>⚠️ <strong>Unanswered:</strong> ${progress.unanswered}</div>
            <div>🔖 <strong>Bookmarked:</strong> ${progress.bookmarked}</div>
          </div>
        `,
        confirmText: 'Yes, Submit Now',
        cancelText: 'Continue Test',
        confirmClass: 'btn-accent',
        onConfirm: submitTest,
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTest();

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (activeTestEngine && activeTestEngine.goToPrevious()) renderCurrentQuestion();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (activeTestEngine) {
          if (activeTestEngine.currentQuestionIndex < activeTestEngine.getQuestionCount() - 1) {
            activeTestEngine.goToNext();
            renderCurrentQuestion();
          } else {
            confirmSubmitModal();
          }
        }
      });

      document.getElementById('bookmarkBtn').addEventListener('click', toggleBookmark);
      document.getElementById('clearAnswerBtn').addEventListener('click', clearResponse);
      document.getElementById('submitTestBtn').addEventListener('click', confirmSubmitModal);

      // Mobile palette toggle
      const paletteToggle = document.getElementById('paletteMobileToggle');
      const palette = document.getElementById('questionPalette');
      if (paletteToggle && palette) {
        paletteToggle.addEventListener('click', () => {
          palette.classList.toggle('mobile-open');
        });
      }
    });
  </script>
</body>
</html>
