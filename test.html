<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Take mock test on Mockhard — Practice under real exam timer conditions with instant feedback.">
  <title>Mock Test — Mockhard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body class="test-page">
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="random.html" class="nav-link">Random Test</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ════════ TEST HEADER / BAR ════════ -->
  <header class="test-header">
    <div class="container">
      <div class="test-info">
        <span id="testCategoryName" class="test-category">Exam Category</span>
        <span id="questionCounter" class="test-question-num">Question 1 of 50</span>
      </div>

      <div class="flex items-center gap-md">
        <div id="testTimer" class="timer">
          <span class="timer-icon">⏱️</span>
          <span id="timerText">60:00</span>
        </div>
        <button id="submitTestBtn" class="btn btn-accent btn-sm">Submit Test</button>
      </div>
    </div>
  </header>

  <!-- ════════ TEST BODY ════════ -->
  <main class="container">
    <div class="test-body">
      <!-- Question Section -->
      <section class="question-area">
        <div id="questionNumberHeader" class="question-number">Question 1</div>
        <div id="questionText" class="question-text">Loading question...</div>

        <!-- Options Container -->
        <div id="optionsList" class="options-list">
          <!-- Options rendered dynamically -->
        </div>

        <!-- Question Actions Footer -->
        <div class="question-actions">
          <div class="question-actions-left">
            <button id="bookmarkBtn" class="btn btn-ghost btn-sm bookmark-btn">
              🔖 <span id="bookmarkText">Bookmark</span>
            </button>
            <button id="clearAnswerBtn" class="btn btn-ghost btn-sm">Clear Response</button>
          </div>
          <div class="question-actions-right">
            <button id="prevBtn" class="btn btn-outline btn-sm">◄ Previous</button>
            <button id="nextBtn" class="btn btn-primary btn-sm">Next ►</button>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="test-progress">
          <div class="flex justify-between items-center">
            <span class="progress-text">Progress (<span id="answeredCountText">0</span>/50 Answered)</span>
            <span id="progressPercentageText" class="progress-text">0%</span>
          </div>
          <div class="progress-bar-container">
            <div id="progressBarFill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
        </div>
      </section>

      <!-- Sidebar Question Palette -->
      <aside id="questionPalette" class="question-palette">
        <div class="palette-title">Question Palette</div>
        <div id="paletteGrid" class="palette-grid">
          <!-- Palette buttons 1..50 -->
        </div>

        <!-- Legend -->
        <div class="palette-legend">
          <div class="legend-item">
            <span class="legend-dot current"></span>
            <span>Current Question</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot answered"></span>
            <span>Answered</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot bookmarked"></span>
            <span>Bookmarked for Review</span>
          </div>
          <div class="legend-item">
            <span class="legend-dot not-visited"></span>
            <span>Not Visited / Skipped</span>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Mobile Palette Toggle -->
  <button id="paletteMobileToggle" class="palette-mobile-toggle" aria-label="Toggle question palette">
    📱
  </button>

  <!-- ════════ ALL QUESTION DATA SCRIPTS ════════ -->
  <script src="js/data/upsc.js"></script>
  <script src="js/data/ssc.js"></script>
  <script src="js/data/railways.js"></script>
  <script src="js/data/neet.js"></script>
  <script src="js/data/norcet.js"></script>
  <script src="js/data/jee.js"></script>
  <script src="js/data/gate.js"></script>
  <script src="js/data/clat.js"></script>
  <script src="js/data/board.js"></script>
  <script src="js/data/defence.js"></script>

  <!-- ════════ CORE APP SCRIPTS ════════ -->
  <script src="js/storage.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/app.js"></script>

  <!-- ════════ TEST CONTROLLER SCRIPT ════════ -->
  <script>
    const QUESTION_BANKS = {
      upsc: { name: 'UPSC Civil Services', data: typeof UPSC_QUESTIONS !== 'undefined' ? UPSC_QUESTIONS : [] },
      ssc: { name: 'SSC CGL / CHSL', data: typeof SSC_QUESTIONS !== 'undefined' ? SSC_QUESTIONS : [] },
      railways: { name: 'Railways RRB', data: typeof RAILWAYS_QUESTIONS !== 'undefined' ? RAILWAYS_QUESTIONS : [] },
      neet: { name: 'NEET UG', data: typeof NEET_QUESTIONS !== 'undefined' ? NEET_QUESTIONS : [] },
      norcet: { name: 'AIIMS NORCET', data: typeof NORCET_QUESTIONS !== 'undefined' ? NORCET_QUESTIONS : [] },
      jee: { name: 'JEE Main', data: typeof JEE_QUESTIONS !== 'undefined' ? JEE_QUESTIONS : [] },
      gate: { name: 'GATE Exam', data: typeof GATE_QUESTIONS !== 'undefined' ? GATE_QUESTIONS : [] },
      clat: { name: 'CLAT Law', data: typeof CLAT_QUESTIONS !== 'undefined' ? CLAT_QUESTIONS : [] },
      board: { name: 'Board Examinations', data: typeof BOARD_QUESTIONS !== 'undefined' ? BOARD_QUESTIONS : [] },
      defence: { name: 'Defence (NDA/CDS)', data: typeof DEFENCE_QUESTIONS !== 'undefined' ? DEFENCE_QUESTIONS : [] },
    };

    // State Variables
    let currentCategory = 'upsc';
    let questions = [];
    let currentIndex = 0;
    let userAnswers = {}; // { questionIndex: optionIndex }
    let bookmarked = new Set();
    let totalQuestions = 50;
    let timeLimit = 60 * 60; // 60 mins in seconds (1.2 min / Q)
    let isRandomMode = false;

    function initTest() {
      const params = MockApp.getParams();

      if (params.mode === 'random') {
        isRandomMode = true;
        setupRandomTest(params);
      } else {
        currentCategory = params.category || 'upsc';
        const bank = QUESTION_BANKS[currentCategory] || QUESTION_BANKS.upsc;
        document.getElementById('testCategoryName').textContent = bank.name;
        questions = bank.data;
      }

      totalQuestions = questions.length;
      if (totalQuestions === 0) {
        alert('Category questions loading failed. Redirecting to categories page.');
        window.location.href = 'categories.html';
        return;
      }

      // Check if there is saved in-progress test for this category
      const saved = MockStorage.getInProgress();
      if (saved && saved.category === currentCategory && !isRandomMode) {
        if (confirm('You have an unfinished test in this category. Would you like to resume?')) {
          userAnswers = saved.answers || {};
          bookmarked = new Set(saved.bookmarked || []);
          currentIndex = saved.currentQuestion || 0;
          timeLimit = saved.timeRemaining || (totalQuestions * 72);
        } else {
          MockStorage.clearInProgress();
          timeLimit = totalQuestions * 72; // 1.2 min per question = 72s
        }
      } else {
        timeLimit = totalQuestions * 72;
      }

      // Initialize Timer
      MockTimer.start(timeLimit, onTimerTick, onTimerExpire);

      // Render initial view
      renderPalette();
      renderQuestion(currentIndex);
      updateProgress();

      // Keyboard shortcuts
      document.addEventListener('keydown', handleKeyboard);
    }

    function setupRandomTest(params) {
      document.getElementById('testCategoryName').textContent = '🎲 Random Mixed Test';
      const count = parseInt(params.count) || 25;
      const selectedCats = params.cats ? params.cats.split(',') : Object.keys(QUESTION_BANKS);

      let pool = [];
      selectedCats.forEach(cat => {
        if (QUESTION_BANKS[cat]) {
          pool.push(...QUESTION_BANKS[cat].data);
        }
      });

      questions = MockApp.shuffleArray(pool).slice(0, count);
    }

    function onTimerTick(data) {
      const timerEl = document.getElementById('testTimer');
      const timerText = document.getElementById('timerText');
      timerText.textContent = data.formatted;

      if (data.isDanger) {
        timerEl.className = 'timer danger';
      } else if (data.isWarning) {
        timerEl.className = 'timer warning';
      } else {
        timerEl.className = 'timer';
      }

      // Auto-save every 10s
      if (data.remaining % 10 === 0) {
        autoSaveState();
      }
    }

    function onTimerExpire() {
      MockApp.showToast('Time is up! Submitting your test automatically...', 'warning', 3000);
      setTimeout(() => {
        submitTest();
      }, 1500);
    }

    function autoSaveState() {
      if (isRandomMode) return;
      MockStorage.saveInProgress({
        category: currentCategory,
        answers: userAnswers,
        bookmarked: Array.from(bookmarked),
        timeRemaining: MockTimer.getRemaining(),
        currentQuestion: currentIndex,
      });
    }

    function renderQuestion(index) {
      if (index < 0 || index >= totalQuestions) return;
      currentIndex = index;

      const q = questions[index];
      document.getElementById('questionNumberHeader').textContent = `Question ${index + 1} of ${totalQuestions}`;
      document.getElementById('questionCounter').textContent = `Question ${index + 1} of ${totalQuestions}`;
      document.getElementById('questionText').textContent = q.question;

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, optIdx) => {
        const item = document.createElement('div');
        const isSelected = userAnswers[index] === optIdx;
        item.className = `option-item ${isSelected ? 'selected' : ''}`;
        item.innerHTML = `
          <div class="option-label">${labels[optIdx]}</div>
          <div class="option-text">${opt}</div>
        `;
        item.addEventListener('click', () => selectOption(index, optIdx));
        optionsList.appendChild(item);
      });

      // Update Navigation Buttons
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').textContent = (index === totalQuestions - 1) ? 'Finish & Review' : 'Next ►';

      // Update Bookmark button
      const bookmarkBtn = document.getElementById('bookmarkBtn');
      const isBookmarked = bookmarked.has(index);
      bookmarkBtn.className = `btn btn-ghost btn-sm bookmark-btn ${isBookmarked ? 'active' : ''}`;
      document.getElementById('bookmarkText').textContent = isBookmarked ? 'Bookmarked' : 'Bookmark';

      // Update Palette selection
      updatePaletteHighlight();
    }

    function selectOption(qIdx, optIdx) {
      userAnswers[qIdx] = optIdx;
      renderQuestion(qIdx);
      updateProgress();
      updatePaletteItem(qIdx);
      autoSaveState();
    }

    function clearResponse() {
      delete userAnswers[currentIndex];
      renderQuestion(currentIndex);
      updateProgress();
      updatePaletteItem(currentIndex);
      autoSaveState();
      MockApp.showToast('Response cleared', 'info', 1500);
    }

    function toggleBookmark() {
      if (bookmarked.has(currentIndex)) {
        bookmarked.delete(currentIndex);
        MockApp.showToast('Bookmark removed', 'info', 1500);
      } else {
        bookmarked.add(currentIndex);
        MockApp.showToast('Question bookmarked for review', 'warning', 1500);
      }
      renderQuestion(currentIndex);
      updatePaletteItem(currentIndex);
      autoSaveState();
    }

    function updateProgress() {
      const answeredCount = Object.keys(userAnswers).length;
      const pct = Math.round((answeredCount / totalQuestions) * 100);

      document.getElementById('answeredCountText').textContent = answeredCount;
      document.getElementById('progressPercentageText').textContent = `${pct}%`;
      document.getElementById('progressBarFill').style.width = `${pct}%`;
    }

    function renderPalette() {
      const grid = document.getElementById('paletteGrid');
      grid.innerHTML = '';

      for (let i = 0; i < totalQuestions; i++) {
        const item = document.createElement('button');
        item.id = `paletteItem-${i}`;
        item.className = getPaletteClass(i);
        item.textContent = i + 1;
        item.addEventListener('click', () => {
          renderQuestion(i);
          closeMobilePalette();
        });
        grid.appendChild(item);
      }
    }

    function getPaletteClass(i) {
      let cls = 'palette-item';
      if (i === currentIndex) cls += ' current';
      else if (userAnswers[i] !== undefined) cls += ' answered';
      else if (bookmarked.has(i)) cls += ' bookmarked';
      else cls += ' not-visited';
      return cls;
    }

    function updatePaletteItem(i) {
      const item = document.getElementById(`paletteItem-${i}`);
      if (item) {
        item.className = getPaletteClass(i);
      }
    }

    function updatePaletteHighlight() {
      for (let i = 0; i < totalQuestions; i++) {
        updatePaletteItem(i);
      }
    }

    function closeMobilePalette() {
      const palette = document.getElementById('questionPalette');
      palette.classList.remove('mobile-open');
    }

    function submitTest() {
      MockTimer.stop();
      MockStorage.clearInProgress();

      // Calculate score
      let correctCount = 0;
      questions.forEach((q, idx) => {
        if (userAnswers[idx] === q.correct) {
          correctCount++;
        }
      });

      const timeTaken = MockTimer.getElapsed();

      // Save result to storage
      const resultObj = {
        category: currentCategory,
        categoryName: QUESTION_BANKS[currentCategory] ? QUESTION_BANKS[currentCategory].name : 'Random Test',
        score: correctCount,
        total: totalQuestions,
        timeTaken: timeTaken,
        answers: userAnswers,
        bookmarked: Array.from(bookmarked),
        mode: isRandomMode ? 'random' : 'standard',
      };

      const savedEntry = MockStorage.saveTestResult(resultObj);

      // Store current result temporary in sessionStorage for immediate review
      sessionStorage.setItem('mockhard_latest_result', JSON.stringify({
        ...resultObj,
        id: savedEntry.id,
        questions: questions,
      }));

      // Redirect to results page
      window.location.href = `results.html?id=${savedEntry.id}`;
    }

    function confirmSubmitModal() {
      const answeredCount = Object.keys(userAnswers).length;
      const unAnsweredCount = totalQuestions - answeredCount;
      const bookmarkCount = bookmarked.size;

      MockApp.showModal({
        title: 'Submit Test?',
        body: `
          <p>You are about to submit your test.</p>
          <div style="margin-top: 1rem; padding: 0.75rem; background: var(--bg-secondary); border-radius: var(--radius-md); font-size: 0.9rem;">
            <div>✅ <strong>Answered:</strong> ${answeredCount} / ${totalQuestions}</div>
            <div>⚠️ <strong>Unanswered:</strong> ${unAnsweredCount}</div>
            <div>🔖 <strong>Bookmarked:</strong> ${bookmarkCount}</div>
          </div>
        `,
        confirmText: 'Yes, Submit Now',
        cancelText: 'Continue Test',
        confirmClass: 'btn-accent',
        onConfirm: submitTest,
      });
    }

    function handleKeyboard(e) {
      // Don't trigger if user is typing in an input
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key === 'ArrowRight' || e.key === 'n') {
        if (currentIndex < totalQuestions - 1) renderQuestion(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'p') {
        if (currentIndex > 0) renderQuestion(currentIndex - 1);
      } else if (['a', 'A', '1'].includes(e.key)) {
        selectOption(currentIndex, 0);
      } else if (['b', 'B', '2'].includes(e.key)) {
        selectOption(currentIndex, 1);
      } else if (['c', 'C', '3'].includes(e.key)) {
        selectOption(currentIndex, 2);
      } else if (['d', 'D', '4'].includes(e.key)) {
        selectOption(currentIndex, 3);
      }
    }

    // Bind event listeners
    document.addEventListener('DOMContentLoaded', () => {
      initTest();

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (currentIndex > 0) renderQuestion(currentIndex - 1);
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (currentIndex < totalQuestions - 1) {
          renderQuestion(currentIndex + 1);
        } else {
          confirmSubmitModal();
        }
      });

      document.getElementById('bookmarkBtn').addEventListener('click', toggleBookmark);
      document.getElementById('clearAnswerBtn').addEventListener('click', clearResponse);
      document.getElementById('submitTestBtn').addEventListener('click', confirmSubmitModal);

      // Mobile palette toggle button
      const paletteToggle = document.getElementById('paletteMobileToggle');
      const palette = document.getElementById('questionPalette');
      if (paletteToggle && palette) {
        paletteToggle.addEventListener('click', () => {
          palette.classList.toggle('mobile-open');
        });
      }
    });
  </script>
</body>
</html>
