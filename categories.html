<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all 10 mock test categories on Mockhard — UPSC, SSC, Railways, NEET, NORCET, JEE, GATE, CLAT, Board Exams, Defence.">
  <title>Exam Categories — Mockhard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <!-- ════════ NAVBAR ════════ -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <span class="brand-icon">🎯</span>
        <span class="brand-text">Mockhard</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="categories.html" class="nav-link active">Categories</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="random.html" class="nav-link">Random Test</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
      </div>
      <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
      </button>
    </div>
  </nav>
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- ════════ MAIN CONTENT ════════ -->
  <main class="section" style="padding-top: calc(var(--nav-height) + var(--space-xl));">
    <div class="container">
      <div class="section-header text-left" style="margin-bottom: var(--space-xl);">
        <h2>All Exam Categories</h2>
        <p>Select your target competitive exam to begin a full-length 50-question mock practice test.</p>
      </div>

      <!-- Filter / Search bar -->
      <div class="filter-bar">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="Search exam (e.g. UPSC, NEET, Railways)...">
        </div>
      </div>

      <!-- Categories Grid -->
      <div class="categories-grid" id="categoriesGrid">
        <!-- JS rendered cards -->
      </div>
    </div>
  </main>

  <!-- ════════ FOOTER ════════ -->
  <footer class="footer">
    <div class="container">
      <div class="footer-brand">
        <span>🎯</span>
        <span>Mockhard</span>
      </div>
      <div class="footer-text">Made with ❤️ for aspirants everywhere</div>
      <div class="footer-links">
        <a href="index.html" class="footer-link">Home</a>
        <a href="dashboard.html" class="footer-link">Dashboard</a>
        <a href="random.html" class="footer-link">Random Test</a>
      </div>
    </div>
  </footer>

  <!-- ════════ SCRIPTS ════════ -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    const ALL_CATEGORIES = [
      { id: 'upsc', name: 'UPSC Civil Services', icon: '🏛️', desc: 'General Studies — Indian History, Polity, Geography, Economy & Environment.', questions: 50, time: 60, color: '#0f3460' },
      { id: 'ssc', name: 'SSC CGL / CHSL', icon: '📋', desc: 'General Awareness, Quantitative Aptitude, English Comprehension & Reasoning.', questions: 50, time: 60, color: '#e94560' },
      { id: 'railways', name: 'Railways RRB', icon: '🚂', desc: 'RRB NTPC & Group D — General Science, Math, General Awareness & Reasoning.', questions: 50, time: 60, color: '#06d6a0' },
      { id: 'neet', name: 'NEET UG', icon: '🩺', desc: 'Medical Entrance — Biology (Botany & Zoology), Physics & Chemistry.', questions: 50, time: 60, color: '#f0a500' },
      { id: 'norcet', name: 'AIIMS NORCET', icon: '💉', desc: 'Nursing Officer — Fundamentals, Med-Surg, Pharmacology & Anatomy.', questions: 50, time: 60, color: '#118ab2' },
      { id: 'jee', name: 'JEE Main & Advanced', icon: '⚙️', desc: 'Engineering Entrance — Higher Mathematics, Physics & Chemistry.', questions: 50, time: 60, color: '#7209b7' },
      { id: 'gate', name: 'GATE Examination', icon: '🔬', desc: 'Graduate Aptitude Test — Engineering Mathematics, Aptitude & Core Concepts.', questions: 50, time: 60, color: '#3a0ca3' },
      { id: 'clat', name: 'CLAT Law Entrance', icon: '⚖️', desc: 'Common Law Admission — Legal Aptitude, Logical Reasoning & English.', questions: 50, time: 60, color: '#4cc9f0' },
      { id: 'board', name: 'Board Examinations', icon: '📚', desc: 'Class 10 & 12 Academic — Science, Mathematics, Social Studies & English.', questions: 50, time: 60, color: '#f72585' },
      { id: 'defence', name: 'Defence (NDA & CDS)', icon: '🎖️', desc: 'National Defence Academy — General Ability, Mathematics, English & Science.', questions: 50, time: 60, color: '#2d6a4f' },
    ];

    function renderCategories(filterText = '') {
      const grid = document.getElementById('categoriesGrid');
      grid.innerHTML = '';

      const catStats = MockStorage.getCategoryStats();
      const query = filterText.toLowerCase().trim();

      const filtered = ALL_CATEGORIES.filter(cat => 
        cat.name.toLowerCase().includes(query) || 
        cat.desc.toLowerCase().includes(query) || 
        cat.id.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">🔍</div>
            <h3>No categories found</h3>
            <p>Try searching with another keyword like "UPSC", "NEET", or "Math".</p>
          </div>
        `;
        return;
      }

      filtered.forEach((cat, i) => {
        const stats = catStats[cat.id];
        const card = document.createElement('div');
        card.className = `card card-gradient category-card animate-scale-in`;
        card.style.animationDelay = `${i * 0.05}s`;

        let statusBadge = '';
        if (stats) {
          statusBadge = `<span class="badge badge-success">Attempted (${stats.attempts}x) — Best ${stats.bestScore}%</span>`;
        } else {
          statusBadge = `<span class="badge badge-primary">Not Started</span>`;
        }

        card.innerHTML = `
          <div class="cat-icon" style="background: ${cat.color}15;">
            <span>${cat.icon}</span>
          </div>
          <div style="margin-bottom: var(--space-xs);">${statusBadge}</div>
          <div class="cat-name">${cat.name}</div>
          <div class="cat-desc">${cat.desc}</div>
          <div class="cat-meta">
            <span>📝 ${cat.questions} Questions</span>
            <span>⏱ ${cat.time} Minutes</span>
          </div>
          <a href="test.html?category=${cat.id}" class="btn btn-primary btn-sm" style="width: 100%;">Start Mock Test</a>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.tagName !== 'A' && !e.target.closest('a')) {
            window.location.href = `test.html?category=${cat.id}`;
          }
        });

        grid.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCategories();

      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          renderCategories(e.target.value);
        });
      }
    });
  </script>
</body>
</html>
